# Conda environment for exact reproduction of the reported numbers.
#   conda env create -f environment.yml
#   conda activate team01-flightdelay
#
# The package list mirrors the environment the pipeline was last executed in;
# requirements.txt carries the same ranges for pip users.

name: team01-flightdelay
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas=2.2
  - numpy=1.26
  - pyarrow=15
  - pyyaml=6
  - requests=2.31
  - scipy=1.11
  - statsmodels=0.14
  - scikit-learn=1.4
  - matplotlib=3.8
  - plotly=5.20
  - dash=2.16
  - jupyter_client=8
  - nbformat=5
  - nbclient=0.10
  - ipykernel=6
  - pytest=8
  - pip
